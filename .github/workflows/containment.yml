name: Containment tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  guardian:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest tests/guardian --confcutdir=tests/guardian -q
      - run: python -m examples.guarded_agent.process_demo
      - run: python -m evals.rogue_agent.run
  runtime:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q -m 'not slow and not integration'
